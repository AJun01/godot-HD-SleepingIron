feature: sprite-asset-pipeline
artifacts:
  - path: docs/character-sprite-mapping.md
    type: doc
    role: authoritative 12-row sprite-sheet mapping contract (rows, loop flags, grid, cell invariants)
    invariants:
      - 12 rows x 6 columns of 256px cells (1536x3072, rows = animations)
      - mirrors tools/art_pipeline/character_sheet_map.json (JSON is authoritative)
      - feet aligned to cell bottom; blank cells fully transparent
    validation: python tools/art_pipeline/process_character_sheet.py --make-template --output-dir docs/templates
  - path: docs/templates/character-sheet-template.png
    type: template
    role: blank 12x6 authoring grid with faint cell lines and per-row labels
    invariants:
      - 1536x3072, 256px cells, faint grid lines
      - one label per animation row (name + frames + loop)
      - generated by the tool, never hand-drawn
    validation: python tools/art_pipeline/process_character_sheet.py --make-template --output-dir docs/templates
  - path: tools/art_pipeline/testdata/gemini_source.jpeg
    type: testdata
    role: Gemini trial source sheet (1024x1024 = 4x4 grid) exercising watermark-removal + white-to-alpha flags
    invariants:
      - non-RGBA JPEG input, converted to RGBA by the pipeline
      - 4x4 grid of 256px cells (16 frames)
      - original aspect ratio preserved (no resampling)
    validation: godot --headless --editor --path . --quit-after 10
  - path: tools/art_pipeline/testdata/gemini_frames/
    type: testdata
    role: 16 extracted Gemini frames (256x256 each) for split/compose end-to-end validation
    invariants:
      - 16 numbered frames, one per source cell
      - 256x256 cells, transparency preserved
    validation: godot --headless --editor --path . --quit-after 10
  - path: assets/placeholders/placeholder_character_sheet.png
    type: sprite
    role: labeled 12x6 placeholder character sheet (pipeline authoring input)
    status: placeholder
    invariants:
      - 12 rows x 6 columns of 256px cells (1536x3072)
      - flat-color labeled cells, short rows blank-padded
      - transparent background preserved
    validation: godot --headless --editor --path . --quit-after 10
  - path: assets/sprites/placeholder_character/character_sheet.png
    type: sprite
    role: composed output sheet (blank cells transparent) for the placeholder character
    invariants:
      - 1536x3072, 256px cells
      - nearest-neighbor filtering (project-wide default)
      - transparency preserved through the pipeline
    validation: godot --headless --editor --path . --quit-after 10
  - path: assets/sprites/placeholder_character/character_frames.tres
    type: resource
    role: SpriteFrames resource — 12 animations (idle..death) from the placeholder sheet
    invariants:
      - exactly 12 animations named per docs/character-sprite-mapping.md
      - per-row frame counts equal non-blank cells
      - speed 10, correct per-row loop flags
    validation: godot --headless --editor --path . --quit-after 10
  - path: scenes/dev/sprite_anim_preview.tscn
    type: scene
    role: dev preview (AnimatedSprite2D) that plays the produced .tres and cycles all 12 animations
    invariants:
      - AnimatedSprite2D bound to the produced SpriteFrames, defaults to idle + playing
      - script cycles all 12 animations and toggles flip_h
      - self-contained (no EventBus)
    validation: godot --headless --path . --quit-after 5 scenes/dev/sprite_anim_preview.tscn
