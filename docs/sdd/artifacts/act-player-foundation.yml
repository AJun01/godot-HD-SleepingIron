feature: act-player-foundation
artifacts:
  - path: scenes/actors/player.tscn
    type: scene
    role: side-view player character (CharacterBody3D walking on X and Z with jump on Y, billboarded AnimatedSprite3D)
    invariants:
      - collision layer 2 (player) / mask 1 (world)
      - XZ walking (move_up/move_down drive depth) + jump feel driven by PlayerConfig
      - billboarded AnimatedSprite3D driven by the composable animator
    validation: godot --headless --path . --quit-after 5 scenes/actors/player.tscn
  - path: scenes/act/arena.tscn
    type: scene
    role: standalone ACT test arena (lit 3D walkable floor + steps at distinct Z + player + side-view camera)
    invariants:
      - WorldEnvironment + DirectionalLight3D carry lighting
      - 3D walkable floor (top Y=0, X×Z depth) + two steps (tops ≈ 0.5 / 1.0) at distinct Z; world = layer 1, player = layer 2
      - player spawned at Z=0 within the walkable range; camera is a fixed elevated side view (X-follow, Y≈5.5, Z fixed behind the depth range, pitched ~-25° down at the action)
    validation: godot --headless --path . --quit-after 5 scenes/act/arena.tscn
  - path: scripts/world/player_animator.gd
    type: script
    role: composable five-state animation machine (idle/run/jump/fall/land) driving the AnimatedSprite3D
    invariants:
      - one-way dependency on the player (reads state, never mutates physics)
      - flip_h mirrors facing; land holds until its one-shot finishes
    validation: godot --headless --editor --path . --quit-after 10
  - path: scripts/world/side_view_camera.gd
    type: script
    role: arena side-view follow camera (X-follow smoothing, fixed Y and Z, elevated DNF-style downward pitch; never follows Z)
    invariants:
      - vertical_offset 5.5 / z_distance fixed behind the walkable depth range (fixed Y and Z, never follows Z)
      - constant rotation pitched ~-25° down at the action (pitch_degrees default -25.0), perspective projection
    validation: godot --headless --editor --path . --quit-after 10
  - path: resources/player_config.tres
    type: resource
    role: PlayerConfig tunables for movement, jump and gravity
    invariants:
      - gravity promoted out of @export into the Resource
      - jump buffer + jump-cut values drive tap-vs-hold jump feel
    validation: godot --headless --editor --path . --quit-after 10
  - path: assets/sprites/player/player_sheet.png
    type: sprite-sheet
    role: right-facing player sprite sheet (12 rows x 6 columns, 256px cells, 1536x3072 RGBA)
    invariants:
      - nearest-neighbor filtering; source aspect ratio preserved; no resampling
      - feet aligned to cell bottom; blank cells fully transparent
      - idle row (row 0) is a TEMPORARY single-frame collapse (all 6 cells identical) awaiting new idle art
    validation: godot --headless --editor --path . --quit-after 10
  - path: assets/sprites/player/player_left_sheet.png
    type: sprite-sheet
    role: mirrored-left player sprite sheet (spare; not used by player.tscn)
    invariants:
      - mirror of player_sheet.png; nearest-neighbor; idle row likewise single-frame collapsed
    validation: godot --headless --editor --path . --quit-after 10
  - path: assets/sprites/player/player_frames.tres
    type: resource
    role: SpriteFrames for the right-facing sheet (uid://2k97uge7sf4w pinned)
    invariants:
      - 12 animations x 6 frames; loop flags idle/run/fall true, rest false
      - UID pinned so player.tscn's by-path reference keeps resolving
    validation: godot --headless --path . --quit-after 5 scenes/actors/player.tscn
  - path: assets/sprites/player/player_left_frames.tres
    type: resource
    role: SpriteFrames for the mirrored-left sheet (uid://a2tle527t5pf pinned; spare)
    invariants:
      - 12 animations x 6 frames; same loop flags as right sheet
    validation: godot --headless --editor --path . --quit-after 10
  - path: assets/sprites/player/frames/
    type: sprite-frames
    role: 72 right-facing per-frame PNGs (flat layout <action>_NNN.png) regenerated by tools/art_pipeline/frames_v1_user_process.py
    invariants:
      - idle_000..idle_005 are byte-identical (temporary single-frame idle collapse)
      - despeckled: no isolated near-black components matching area<25 and perimeter_transparent_fraction>=0.5
      - salt-and-pepper despeckled: no opaque pixel with Rec.601 luminance<100 and >5 transparent 8-neighbors (3 sweeps, 0 residual)
    validation: godot --headless --editor --path . --quit-after 10
