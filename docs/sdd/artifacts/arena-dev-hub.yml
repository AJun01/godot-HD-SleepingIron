feature: arena-dev-hub
artifacts:
  - path: scenes/act/arena.tscn
    type: scene
    role: six-zone dev-hub arena (flat walkable ground laid out along X with movement/jump, animation preview, combat range, UI/HUD, save/load and audio zones; lit 3D world + player + side-view camera + central architecture wall)
    invariants:
      - WorldEnvironment + DirectionalLight3D carry lighting
      - single walkable ground StaticBody3D (world = layer 1, mask = 2) spanning six zones along X
      - movement zone has runway + two step boxes; combat range has three inert billboarded dummies (no script)
      - central ArchitectureWall plane (unshaded albedo = architecture SVG, cast_shadow off) stands at the arena back
      - player + SideViewCamera wiring preserved (camera X-follows, fixed Y/Z, pitched down)
    validation: godot --headless --path . --quit-after 5 scenes/act/arena.tscn
  - path: scenes/dev/zone_pillar.tscn
    type: scene
    role: reusable billboarded Label3D zone pillar (Node3D + Label3D) driven by zone_pillar.gd
    invariants:
      - billboarded Label3D composed from @export title/responsibility/paths
      - no physics body; content-only sign
    validation: godot --headless --editor --path . --quit-after 10
  - path: scripts/dev/zone_pillar.gd
    type: script
    role: composable ZonePillar (composes @export title/responsibility/paths into the Label3D text, defensive label path resolution)
    invariants:
      - static typing, @export dependency injection, no get_node("../..")
    validation: godot --headless --editor --path . --quit-after 10
  - path: assets/placeholders/placeholder_target_dummy.svg
    type: sprite
    role: combat-range target dummy placeholder (flat humanoid silhouette + target ring + text label)
    status: placeholder
    invariants:
      - source aspect ratio preserved; nearest-neighbor filtering
      - transparent background so the billboarded dummy stands on the ground
    validation: godot --headless --editor --path . --quit-after 10
  - path: assets/ui/architecture_diagram.svg
    type: texture
    role: central architecture-wall diagram (nodes = autoloads/services + scenes, edges = dependencies) baked to glyph paths so Godot/ThorVG renders it without SVG text support
    invariants:
      - 1920x1080 (16:9) to match the wall plane's 16x9 aspect
      - regenerated by tools/architecture_wall/generate_architecture_svg.py
    validation: godot --headless --editor --path . --quit-after 10
  - path: scripts/autoload/save_service.gd
    type: script
    role: minimal SaveService autoload (JSON position Vector3 + facing int to user://arena_save.json; load returns position + facing or empty Dictionary on failure)
    invariants:
      - static typing; save writes JSON, load returns empty Dictionary on any failure
      - single small service boundary, no full save system
    validation: godot --headless --editor --path . --quit-after 10
  - path: scripts/dev/save_load_trigger.gd
    type: script
    role: composable Area3D save/restore trigger (interaction layer 3 / mask 2; save_mode + player_path @export; restore applied via call_deferred)
    invariants:
      - explicit collision layer 3 / mask 2 (no defaults)
      - @export DI + defensive player_path resolution; restore deferred from body_entered
    validation: godot --headless --path . --quit-after 5 scenes/act/arena.tscn
  - path: scripts/dev/animation_preview_zone.gd
    type: script
    role: composable animation-preview zone controller (Node3D) that cycles the 12 player animations via a next-animation pad, toggles facing via a flip pad, shows the current animation on a status Label3D, and stops the preview when the player leaves the zone
    invariants:
      - static typing, @export dependency injection, no get_node("../..")
      - pads on interaction layer 3 / mask 2 (no defaults); body_entered/body_exited mutations deferred
    validation: godot --headless --path . --quit-after 5 scenes/act/arena.tscn
  - path: scripts/world/player_animator.gd
    type: script
    role: composable five-state animator extended with a preview mode (play_preview/stop_preview) that forces one of the 12 SpriteFrames animations past the physics-derived mapping
    invariants:
      - static typing; preview preserves the facing flip and resumes auto-mapping on stop_preview
      - one-way dependency preserved (animator reads player; player never references animator)
    validation: godot --headless --editor --path . --quit-after 10
  - path: scripts/autoload/objective_hud.gd
    type: script
    role: autoload objective HUD extended with a lazy test health bar (show_test_health_bar/hide_test_health_bar) built in the existing CanvasLayer, toggled by the UI/HUD zone smoke test
    invariants:
      - static typing; bar built lazily in the same CanvasLayer as the objective label; first build deferred from signal callbacks
      - test bar sits below the objective label so it never overlaps the objective text or the transition overlay
    validation: godot --headless --editor --path . --quit-after 10
  - path: scripts/dev/ui_hud_trigger.gd
    type: script
    role: composable Area3D UI/HUD trigger (interaction layer 3 / mask 2; @export mode health vs dialogue) that toggles the ObjectiveHud test health bar on body_entered/body_exited or plays the hub_test dialogue via DialogueService on body_entered
    invariants:
      - explicit collision layer 3 / mask 2 (no defaults)
      - @export mode + @export DialogueData DI; dialogue call guarded by DialogueService.is_open()
    validation: godot --headless --path . --quit-after 5 scenes/act/arena.tscn
  - path: resources/dialogue/hub_test.tres
    type: resource
    role: minimal DialogueData smoke-test fixture (speaker + two lines) played by the UI/HUD dialogue trigger
    invariants:
      - DialogueData shape only (speaker + ordered lines); no content baked into scenes or services
    validation: godot --headless --editor --path . --quit-after 10
