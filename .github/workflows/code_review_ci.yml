name: Godot Code Quality & Review CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # 1. GDScript 静态语法与规范检查（GDToolkit/gdlint）
  static-analysis:
    name: GDScript Static Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDToolkit
        run: |
          python -m pip install --upgrade pip
          pip install "gdtoolkit==4.*"

      - name: Run GDLint
        run: gdlint .

  # 2. Godot 无头模式导入 + 脚本编译 + 主场景冒烟运行（与项目同版本 4.7.1）
  headless-engine-check:
    name: Godot Headless Compile & Scene Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1 headless
        run: |
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Headless import & script compile check
        run: |
          # Pass 1: warm up the fresh import cache (first import run on a clean
          # checkout can emit benign startup errors while .fontdata is generated —
          # e.g. a custom theme font loading before its import cache exists).
          godot --headless --editor --path . --quit-after 120 || true
          # Pass 2: strict gate — with a warm cache any remaining
          # ERROR/SCRIPT ERROR/Parse Error/Failed loading is a real defect.
          godot --headless --editor --path . --quit-after 60 2>&1 | tee import.log
          ! grep -E "ERROR|SCRIPT ERROR|Parse Error|Failed loading" import.log

      - name: Boot scene smoke run
        run: |
          godot --headless --path . --quit-after 10 scenes/boot.tscn 2>&1 | tee boot.log
          ! grep -E "ERROR|SCRIPT ERROR|Parse Error|Failed loading" boot.log
